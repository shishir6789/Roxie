<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff3388" />
      <stop offset="35%" stop-color="#f43f8e" />
      <stop offset="70%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Outer soft neon glow -->
    <filter id="neonBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feGaussianBlur stdDeviation="6" result="blur3" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark futuristic background -->
  <rect width="512" height="512" fill="#08060c" />

  <!-- Background subtle radial aura -->
  <radialGradient id="bgAura" cx="50%" cy="52%" r="45%">
    <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18" />
    <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05" />
    <stop offset="100%" stop-color="#08060c" stop-opacity="0" />
  </radialGradient>
  <circle cx="256" cy="266" r="230" fill="url(#bgAura)" />

  <g transform="translate(256, 260) scale(1.02) translate(-256, -260)">
    <!-- Glow Layers behind the path -->
    <!-- Path: Stylized continuous Neon Flame Loop -->
    <!-- Tip starts at top (240, 130) curving softly to the right apex (252, 145), then sweeping down the left flank -->
    <!-- Bottom sweeps to (256, 355), right curves up to (335, 275), then loops inward gracefully to (236, 255) and sweeps up to (250, 175) -->

    <!-- Deep Ambient Glow Layer -->
    <path
      d="M 242 135
         C 245 130, 255 130, 258 138
         C 270 165, 305 205, 305 240
         C 305 260, 290 280, 265 295
         C 240 310, 225 330, 245 352
         C 260 365, 295 365, 325 340
         C 345 320, 340 280, 335 255
         M 242 135
         C 225 170, 175 220, 175 270
         C 175 325, 215 360, 270 360
         C 320 360, 345 320, 340 280
         C 335 245, 300 230, 275 240
         C 240 255, 220 295, 248 335"
      fill="none"
      stroke="url(#neonGradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.35"
      filter="url(#neonBloom)"
    />

    <!-- Main Solid Glowing Flame Loop Ribbon -->
    <path
      d="M 242 135
         C 225 170, 175 220, 175 270
         C 175 325, 215 360, 270 360
         C 320 360, 345 320, 340 280
         C 335 245, 300 230, 275 240
         C 240 255, 220 295, 248 335
         C 255 345, 275 350, 295 340
         C 320 325, 332 295, 330 265"
      fill="none"
      stroke="url(#neonGradient)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Bright White-Hot Inner Core for authentic neon light tube appearance -->
    <path
      d="M 242 135
         C 225 170, 175 220, 175 270
         C 175 325, 215 360, 270 360
         C 320 360, 345 320, 340 280
         C 335 245, 300 230, 275 240
         C 240 255, 220 295, 248 335
         C 255 345, 275 350, 295 340
         C 320 325, 332 295, 330 265"
      fill="none"
      stroke="#ffffff"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
  </g>
</svg>